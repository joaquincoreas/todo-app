<!DOCTYPE html>

<html lang="en">

<head>
  <title>Todo App</title>
  <link rel="stylesheet" href="../static/styles.css">
</head>

<!-- task[0,1,2] correspond to id, title, and completed -->
<body>
  <main class="container">
    <h1>Todo</h1>
    <form method="POST">
      <input type="text" autocomplete="off" name="newtask" placeholder="Task">
      <button type="submit">Add</button>
    </form>

    <section>
      <h2>Tasks</h2>
      {% for task in tasks %}
      {% if task[2] == 0 %}
      <div class="task">
        <div>
          <form method="POST">
            <input type="hidden" name="id" value="{{ task[0] }}">
            <input type="hidden" name="action" value="update">
            <input type="checkbox" name="completed" onchange="this.form.submit()">
            {{ task[1] }}
          </form>
        </div>

        <div class="task-options">
          <form method="POST">
            <input type="hidden" name="action" value="edit">
            <input type="hidden" name="id" value="{{ task[0] }}">
            <input type="text" name="title" value="{{ task[1] }}">
            <button type="submit">Save</button>
          </form>
          <form method="POST">
            <input type="hidden" name="action" value="delete">
            <input type="hidden" name="id" value="{{ task[0] }}">
            <button type="submit">Delete</button>
          </form>
        </div>
      </div>
      {% endif %}
      {% endfor %}
    </section>

    <section>
      <h2>Completed</h2>
      {% for task in tasks %}
      {% if task[2] == 1 %}
      <div class="task">
        <div>
          <form method="POST">
            <input type="hidden" name="id" value="{{ task[0] }}">
            <input type="hidden" name="action" value="update">
            <input type="checkbox" name="completed" value="on" checked onchange="this.form.submit()">
            {{ task[1] }}
          </form>
        </div>

        <div class="task-options">
          <form method="POST">
            <input type="hidden" name="action" value="edit">
            <input type="hidden" name="id" value="{{ task[0] }}">
            <input type="text" name="title" value="{{ task[1] }}">
            <button type="submit">Save</button>
          </form>
          <form method="POST">
            <input type="hidden" name="action" value="delete">
            <input type="hidden" name="id" value="{{ task[0] }}">
            <button type="submit">Delete</button>
          </form>
        </div>
      </div>
      {% endif %}
      {% endfor %}
    </section>

  </main>
</body>
